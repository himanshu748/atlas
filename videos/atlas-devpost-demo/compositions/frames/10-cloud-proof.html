  <script>
    (() => {
      const stage = document.querySelector("#root .f10-cloud-proof-scene");
      const cameraScale = document.getElementById("f10-cloud-proof-camera-scale");
      const cameraShift = document.getElementById("f10-cloud-proof-camera-shift");
      const world = document.getElementById("f10-cloud-proof-world");
      const blurNode = document.getElementById("f10-cloud-proof-streak-blur");

      const targetPose = (id) => {
        const stageRect = stage.getBoundingClientRect();
        const targetRect = document.getElementById(id).getBoundingClientRect();
        return {
          x: -(targetRect.left + targetRect.width / 2 - (stageRect.left + stageRect.width / 2)),
          y: -(targetRect.top + targetRect.height / 2 - (stageRect.top + stageRect.height / 2)),
        };
      };

      const runRevision = targetPose("f10-cloud-proof-run-revision-target");
      const runTraffic = targetPose("f10-cloud-proof-run-traffic-target");
      const runtimeFlag = targetPose("f10-cloud-proof-runtime-flag-target");
      const runtimeConcurrency = targetPose("f10-cloud-proof-runtime-concurrency-target");
      const runtimeMaximum = targetPose("f10-cloud-proof-runtime-maximum-target");
      const trace = targetPose("f10-cloud-proof-trace-target");

      const camera = {
        scale: 1.48,
        x: runRevision.x,
        y: runRevision.y,
      };

      const applyCamera = () => {
        gsap.set(cameraScale, { scale: camera.scale });
        gsap.set(cameraShift, { x: camera.x, y: camera.y });
      };

      const blur = { x: 0, y: 0 };
      const writeBlur = () => {
        blurNode.setAttribute("stdDeviation", `${blur.x} ${blur.y}`);
      };

      applyCamera();
      writeBlur();

      const tl = gsap.timeline({ paused: true });

      tl.set(world, { rotateX: 0, rotateY: 0, transformPerspective: 1900 }, 0);

      tl.fromTo(
        "#f10-cloud-proof-chrome",
        { y: -14, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.42, ease: "power3.out" },
        0,
      );
      tl.fromTo(
        "#f10-cloud-proof-revision-callout",
        { x: -32, opacity: 0 },
        { x: 0, opacity: 1, duration: 0.48, ease: "power4.out" },
        0.04,
      );
      tl.fromTo(
        "#f10-cloud-proof-active-row",
        { scaleX: 0, opacity: 0 },
        { scaleX: 1, opacity: 1, duration: 0.54, ease: "power3.out" },
        0.08,
      );

      tl.to(
        camera,
        {
          scale: 2.05,
          x: runTraffic.x,
          y: runTraffic.y,
          duration: 1.25,
          ease: "power4.out",
          onUpdate: applyCamera,
        },
        0.58,
      );
      tl.fromTo(
        blur,
        { x: 11, y: 11 },
        {
          x: 0,
          y: 0,
          duration: 1.25,
          ease: "power4.out",
          onUpdate: writeBlur,
          immediateRender: false,
        },
        0.58,
      );
      tl.fromTo(
        "#f10-cloud-proof-traffic-cell",
        { scaleX: 0, opacity: 0 },
        { scaleX: 1, opacity: 1, duration: 0.46, ease: "power3.out" },
        1.24,
      );
      tl.fromTo(
        "#f10-cloud-proof-traffic-callout",
        { x: 30, opacity: 0 },
        { x: 0, opacity: 1, duration: 0.5, ease: "power4.out" },
        1.42,
      );

      const whipStart = { x: runTraffic.x, y: runTraffic.y, scale: 2.05 };
      const whipDelta = {
        x: runtimeFlag.x - whipStart.x,
        y: runtimeFlag.y - whipStart.y,
        scale: 1.72 - whipStart.scale,
      };

      tl.to(
        camera,
        {
          x: whipStart.x + whipDelta.x * 0.1,
          y: whipStart.y + whipDelta.y * 0.1,
          scale: whipStart.scale + whipDelta.scale * 0.1,
          duration: 0.15,
          ease: "power3.in",
          onUpdate: applyCamera,
        },
        3.398,
      );
      tl.to(
        camera,
        {
          x: whipStart.x + whipDelta.x * 0.75,
          y: whipStart.y + whipDelta.y * 0.75,
          scale: whipStart.scale + whipDelta.scale * 0.75,
          duration: 0.13,
          ease: "none",
          onUpdate: applyCamera,
        },
        3.548,
      );
      tl.to(
        camera,
        {
          x: runtimeFlag.x,
          y: runtimeFlag.y,
          scale: 1.72,
          duration: 0.45,
          ease: "power4.out",
          onUpdate: applyCamera,
        },
        3.678,
      );
      tl.to(
        blur,
        { x: 18, y: 0, duration: 0.15, ease: "power3.in", onUpdate: writeBlur },
        3.398,
      );
      tl.to(
        blur,
        { x: 0, y: 0, duration: 0.45, ease: "power4.out", onUpdate: writeBlur },
        3.678,
      );
      tl.fromTo(
        "#f10-cloud-proof-flag-callout",
        { x: 40, opacity: 0 },
        { x: 0, opacity: 1, duration: 0.48, ease: "power4.out" },
        4.1,
      );

      tl.to(
        camera,
        {
          x: runtimeConcurrency.x,
          y: runtimeConcurrency.y,
          scale: 1.68,
          duration: 0.55,
          ease: "power4.out",
          onUpdate: applyCamera,
        },
        4.45,
      );
      tl.fromTo(
        blur,
        { x: 0, y: 12 },
        {
          x: 0,
          y: 0,
          duration: 0.55,
          ease: "power4.out",
          onUpdate: writeBlur,
          immediateRender: false,
        },
        4.45,
      );
      tl.fromTo(
        "#f10-cloud-proof-concurrency-callout",
        { x: 30, opacity: 0 },
        { x: 0, opacity: 1, duration: 0.42, ease: "power4.out" },
        4.72,
      );

      tl.to(
        camera,
        {
          x: runtimeMaximum.x,
          y: runtimeMaximum.y,
          scale: 1.68,
          duration: 0.55,
          ease: "power3.inOut",

        },

      tl.fromTo(

        { x: 0, y: 10 },
        {
          x: 0,
          y: 0,
          duration: 0.55,
          ease: "power3.out",
          onUpdate: writeBlur,

        },

      tl.fromTo(
