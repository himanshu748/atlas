      ];
      const BASE_DURATION = 0.52;
      const SEC_PER_CHAR = 0.012;
      const TAIL_PAD = 0.15;
      let cumulative = 0;
      const CONTENT_TIMELINE = CONTENT.map((entry) => {
        const itemDuration = BASE_DURATION + entry.title.length * SEC_PER_CHAR + entry.hold;
        const start = cumulative;
        cumulative += itemDuration;
        return { ...entry, start, end: cumulative };
      });
      const entryAt = (time) => {
        for (let index = CONTENT_TIMELINE.length - 1; index >= 0; index -= 1) {
          if (time >= CONTENT_TIMELINE[index].start) return CONTENT_TIMELINE[index];
        }
        return CONTENT_TIMELINE[0];
      };

      const STAT_SEQUENCE_START = 3.28;
      const TOTAL_SEQUENCE_DURATION = cumulative + TAIL_PAD;
      const sequenceDriver = { t: 0 };
      const sequenceBody = q('[class~="08-package-shows-gaps-sequence-body"]');

          STAT_SEQUENCE_START + CONTENT_TIMELINE[index].start

      });

        sequenceFill,
        { scaleX: 0 },
        { scaleX: 1, duration: TOTAL_SEQUENCE_DURATION, ease: "none" },
        STAT_SEQUENCE_START
      );
      tl.to(
        sequenceDriver,
        {
          t: TOTAL_SEQUENCE_DURATION,
          duration: TOTAL_SEQUENCE_DURATION,
          ease: "none",
          onUpdate: () => {
            const entry = entryAt(sequenceDriver.t);
            if (entry.title !== lastTitle) {
              sequenceBody.textContent = entry.title;
              lastTitle = entry.title;
            }
          }
        },
        STAT_SEQUENCE_START
      );

      const rootRow = q('[class~="08-package-shows-gaps-root-row"]');
      const rootSelector = q('[class~="08-package-shows-gaps-root-selector"]');
