  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script>
    (() => {
      const FRAME_ID = "09-verify-independently";
      const DURATION = 8.68;
      const root = document.querySelector('[data-composition-id="09-verify-independently"]');
      const byId = (id) => root.ownerDocument.getElementById(id);
      const terminal = root.querySelector('[class~="09-verify-independently-terminal"]');
      const chipContent = root.querySelector('[class~="09-verify-independently-chip-content"]');
      const terminalUi = root.querySelector('[class~="09-verify-independently-terminal-ui"]');
      const commandEl = byId("09-verify-independently-command");
      const cursorEl = byId("09-verify-independently-cursor");

      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      window.__timelines[FRAME_ID] = tl;

      const durationGuard = { p: 0 };
      tl.to(durationGuard, { p: 1, duration: DURATION, ease: "none" }, 0);

      tl.fromTo(
        terminal,
        {
          scale: 0.035,
          borderRadius: 166,
          backgroundColor: "#63e6a6"
        },
        {
          scale: 1,
          borderRadius: 0,
          backgroundColor: "#111516",
          duration: 0.9,
          ease: "power2.inOut"
        },
        0.04
      );

      tl.fromTo(
        chipContent,
        { opacity: 1 },
        { opacity: 0, duration: 0.36, ease: "power1.in" },
        0.04
      );

      tl.fromTo(
        terminalUi,
        { opacity: 0 },
        { opacity: 1, duration: 0.36, ease: "power1.out" },
        0.58
      );

      const COMMAND_SEQUENCE = [
        { t: 0.00, text: "" },
        { t: 0.08, text: "py" },
        { t: 0.18, text: "python" },
        { t: 0.31, text: "python " },
        { t: 0.44, text: "python scripts" },
        { t: 0.58, text: "python scripts/" },
        { t: 0.71, text: "python scripts/verify_" },
        { t: 0.88, text: "python scripts/verify_manfi" },
        { t: 1.03, text: "python scripts/verify_man" },
        { t: 1.18, text: "python scripts/verify_manifest.py" },
        { t: 1.32, text: "python scripts/verify_manifest.py " },
        { t: 1.50, text: "python scripts/verify_manifest.py manifest.json" }
      ];

      const commandAt = (time) => {
        for (let i = COMMAND_SEQUENCE.length - 1; i >= 0; i -= 1) {
          if (time >= COMMAND_SEQUENCE[i].t) return COMMAND_SEQUENCE[i].text;
        }
        return "";
      };

      const commandDriver = { t: 0 };
      let lastCommand = "";
      tl.to(
        commandDriver,
        {
          t: 1.56,
          duration: 1.56,
          ease: "none",
          onUpdate: () => {
            const nextCommand = commandAt(commandDriver.t);
            if (nextCommand !== lastCommand) {
              commandEl.textContent = nextCommand;
              lastCommand = nextCommand;
            }
          }
        },
        1.02
      );

      const blinkDriver = { p: 0, t: 0 };
      tl.to(
        blinkDriver,
        {
          p: Math.PI * 2 * 12,
          t: DURATION,
          duration: DURATION,
          ease: "none",
          onUpdate: () => {
            cursorEl.style.opacity = blinkDriver.t >= 6.274
              ? "0.18"
              : (Math.sin(blinkDriver.p) > 0 ? "1" : "0");
          }
        },
        0
      );

      const CHECKS = [
        { id: "09-verify-independently-check-root", body: "root hash re-derived", hold: 0.58 },
        { id: "09-verify-independently-check-screen", body: "all 28 artifacts screened", hold: 0.68 },
        { id: "09-verify-independently-check-provenance", body: "identity labels present", hold: 0.78 }
      ];
      const BASE_DURATION = 0.6;
      const SEC_PER_CHAR = 0.03;
      const WINDOW_START = 2.76;
      const WINDOW_DURATION = 2.56;
      const rawTotal = CHECKS.reduce(
        (total, entry) => total + BASE_DURATION + entry.body.length * SEC_PER_CHAR + entry.hold,
        0
      );
      const timingScale = WINDOW_DURATION / rawTotal;
      let cumulative = 0;
      const CHECK_TIMELINE = CHECKS.map((entry) => {
        const rawDuration = BASE_DURATION + entry.body.length * SEC_PER_CHAR + entry.hold;
        const start = WINDOW_START + cumulative * timingScale;
        cumulative += rawDuration;
        return { ...entry, start };
      });

      CHECK_TIMELINE.forEach((entry) => {
        const row = byId(entry.id);
        tl.fromTo(
          row,
          { scale: 0, opacity: 0, y: 10 },
          { scale: 1, opacity: 1, y: 0, duration: 0.56, ease: "power3.out" },
          entry.start
        );
      });

      tl.fromTo(
        byId("09-verify-independently-gap"),
        { scale: 0, opacity: 0, y: 8 },
        { scale: 1, opacity: 1, y: 0, duration: 0.54, ease: "power3.out" },
        5.58
      );

      const result = byId("09-verify-independently-result");
      const resultTitle = byId("09-verify-independently-result-title");
      const resultDetail = byId("09-verify-independently-result-detail");

      tl.fromTo(
        result,
        { scaleY: 0, opacity: 0 },
        { scaleY: 1, opacity: 1, duration: 0.58, ease: "power3.out" },
        6.274
      );
      tl.fromTo(
        resultTitle,
        { x: -24, opacity: 0 },
        { x: 0, opacity: 1, duration: 0.48, ease: "power3.out" },
        6.48
      );
      tl.fromTo(
        resultDetail,
        { x: 24, opacity: 0 },
        { x: 0, opacity: 1, duration: 0.48, ease: "power3.out" },
        6.82
      );
    })();
