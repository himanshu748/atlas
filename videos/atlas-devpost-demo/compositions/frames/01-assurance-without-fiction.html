    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      (() => {
        const FRAME_ID = "01-assurance-without-fiction";
        const DURATION = 4.4;
        const FINAL_START = 2.494;

        const vertical = document.getElementById(`${FRAME_ID}-grid-vertical`);
        const horizontal = document.getElementById(`${FRAME_ID}-grid-horizontal`);
        const anchor = document.getElementById(`${FRAME_ID}-anchor`);
        const anchorCopy = document.getElementById(`${FRAME_ID}-anchor-copy`);
        const token = document.getElementById(`${FRAME_ID}-token`);
        const marker = document.getElementById(`${FRAME_ID}-marker`);

        const TOKEN_SEQUENCE = [
          { t: 0, text: "collect" },
          { t: 1.343, text: "evidence" },
        ];

        function tokenAt(time) {
          for (let i = TOKEN_SEQUENCE.length - 1; i >= 0; i -= 1) {
            if (time >= TOKEN_SEQUENCE[i].t) return TOKEN_SEQUENCE[i].text;
          }
          return TOKEN_SEQUENCE[0].text;
        }

        const tokenDriver = { t: 0 };
        let lastToken = "collect";

        const FINAL_CONTENT = [
          {
            el: document.getElementById(`${FRAME_ID}-final-never`),
            text: "never",
            from: { opacity: 0, scale: 1.075 },
            ease: "expo.out",
          },
          {
            el: document.getElementById(`${FRAME_ID}-final-invent`),
            text: "invent",
            from: { opacity: 0, x: -0.9 * 19.2 },
            ease: "power3.out",
          },
          {
            el: document.getElementById(`${FRAME_ID}-final-assurance`),
            text: "assurance",
            from: { opacity: 0, y: 0.032 * 1080 },
            ease: "back.out(1.35)",
          },
        ];

        const BASE_DURATION = 0.22;
        const SECONDS_PER_CHARACTER = 0.025;
        let cumulative = 0;
        const FINAL_TIMELINE = FINAL_CONTENT.map((entry) => {
          const duration = BASE_DURATION + entry.text.length * SECONDS_PER_CHARACTER;
          const start = cumulative;
          cumulative += duration;
          return { ...entry, start, end: cumulative };
        });

        const tl = gsap.timeline({ paused: true });

        tl.fromTo(
          vertical,
          { scaleY: 0, opacity: 0 },
          { scaleY: 1, opacity: 0.54, duration: 0.56, ease: "power2.out" },
          0.1,
        );
        tl.fromTo(
          horizontal,
          { scaleX: 0, opacity: 0 },
          { scaleX: 1, opacity: 0.54, duration: 0.62, ease: "expo.out" },
          0.16,
        );
        tl.fromTo(
          anchorCopy,
          { y: 0.018 * 1080, opacity: 0 },
          { y: 0, opacity: 1, duration: 0.48, ease: "power3.out" },
          0.14,
        );
        tl.fromTo(
          token,
          { opacity: 0, scale: 1.06 },
          { opacity: 1, scale: 1.018, duration: 0.06, ease: "steps(1)" },
          0.25,
        );
        tl.to(token, { scale: 1, duration: 0.34, ease: "power4.out" }, 0.31);

        tl.to(
          tokenDriver,
          {
            t: DURATION,
            duration: DURATION,
            ease: "none",
            onUpdate: () => {
              const nextToken = tokenAt(tokenDriver.t);
              if (nextToken !== lastToken) {
                token.textContent = nextToken;
                lastToken = nextToken;
              }
            },
          },
          0,
        );

        tl.fromTo(
          token,
          { scale: 1.045 },
          {
            scale: 1,
            duration: 0.32,
            ease: "power3.out",
            immediateRender: false,
          },
          1.343,
        );
        tl.fromTo(
          marker,
          { scaleX: 0, opacity: 0 },
          { scaleX: 1, opacity: 1, duration: 0.48, ease: "power2.out" },
          1.48,
        );

        tl.set(anchor, { opacity: 0, immediateRender: false }, FINAL_START);
        tl.to(
          [vertical, horizontal],
          { opacity: 0.32, duration: 0.34, ease: "power1.out" },
          FINAL_START,
        );

        FINAL_TIMELINE.forEach((entry, index) => {
          const entranceDuration = Math.min(0.44, entry.end - entry.start + 0.08);
          const to = {
            opacity: 1,
            x: 0,
            y: 0,
            scale: 1,
            duration: entranceDuration,
            ease: entry.ease,
          };
          tl.fromTo(entry.el, entry.from, to, FINAL_START + entry.start);
        });

        window.__timelines = window.__timelines || {};
        window.__timelines[FRAME_ID] = tl;
      })();
