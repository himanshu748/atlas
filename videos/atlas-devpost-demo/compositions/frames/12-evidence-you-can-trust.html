      const tl = gsap.timeline({ paused: true });
      window.__timelines[FRAME_ID] = tl;

      const durationGuard = { p: 0 };
      tl.to(durationGuard, { p: 1, duration: DURATION, ease: "none" }, 0);

      const TEXT_SEQUENCE = [
        { t: 0, text: "evidence" },
        { t: 1.05, text: "gaps" },
        { t: 2.09, text: "verify" }
      ];

      const textAt = (time) => {
        for (let i = TEXT_SEQUENCE.length - 1; i >= 0; i -= 1) {
          if (time >= TEXT_SEQUENCE[i].t) return TEXT_SEQUENCE[i].text;
        }
        return TEXT_SEQUENCE[0].text;
      };

      const sequenceDriver = { t: 0 };
      let lastText = "evidence";
      tl.to(
        sequenceDriver,
        {
          t: 3.126,
          duration: 3.126,
          ease: "none",
          onUpdate: () => {
            const nextText = textAt(sequenceDriver.t);
            if (nextText !== lastText) {
              sequenceWord.textContent = nextText;
              lastText = nextText;
            }
          }
        },
        0
      );

      const blinkDriver = { p: 0 };
      tl.to(
        blinkDriver,
        {
          p: Math.PI * 2 * 5,
          duration: 3.126,
          ease: "none",
          onUpdate: () => {
            cursor.style.opacity = Math.sin(blinkDriver.p) > 0 ? "1" : "0";

        wordLayer,

          scale: 0.7,
