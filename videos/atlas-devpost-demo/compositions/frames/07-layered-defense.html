      tl.fromTo(
        managedStage,
        { opacity: 0, y: "2cqh" },
        { opacity: 1, y: "0cqh", duration: 0.54, ease: "power3.out" },
        2.83
      );
      tl.to(
        traveler,
        { y: "10.7cqh", scale: 0.78, duration: 0.8, ease: "power2.inOut" },
        2.82
      );
      tl.fromTo(
        managedResult,
        { opacity: 0, y: "1.1cqh" },
        { opacity: 1, y: "0cqh", duration: 0.5, ease: "power2.out" },
        4.52
      );
      tl.to(
        policyPath,
        { strokeDashoffset: 0, duration: 0.64, ease: "power2.out" },
        5.22
      );

      const deterministicStage = q('[class~="07-layered-defense-deterministic"]');
      const policyText = q('[class~="07-layered-defense-policy-text"]');
      const policyCursor = q('[class~="07-layered-defense-policy-cursor"]');

      tl.fromTo(
        deterministicStage,
        { opacity: 0, y: "2cqh" },
        { opacity: 1, y: "0cqh", duration: 0.56, ease: "power3.out" },
        6.14
      );

      const policyStates = [
        { t: 0, text: "" },
        { t: 0.16, text: "prompt-" },
        { t: 0.37, text: "prompt-injec" },
        { t: 0.6, text: "prompt-injectoin." },
        { t: 0.83, text: "prompt-injection." },
        { t: 1.18, text: "prompt-injection.override" }
      ];
      const policyDriver = { t: 0 };
      const textAt = (time) => {
        for (let index = policyStates.length - 1; index >= 0; index -= 1) {
          if (time >= policyStates[index].t) return policyStates[index].text;
        }
        return "";
      };

      tl.to(
        policyDriver,
        {
          t: 1.42,
          duration: 1.42,
          ease: "none",
          onUpdate: () => {
            policyText.textContent = textAt(policyDriver.t);
          }
        },
        6.31
      );

      const cursorDriver = { p: 0 };
      tl.to(
        cursorDriver,
        {
          p: Math.PI * 8,
          duration: 3.2,
          ease: "none",
          onUpdate: () => {
            policyCursor.style.opacity = Math.sin(cursorDriver.p) >= 0 ? "1" : "0";
          }
        },
        6.3
      );

      tl.to(
        blockPath,
        { strokeDashoffset: 0, duration: 0.58, ease: "power2.out" },
        7.48
      );

      const blockedStage = q('[class~="07-layered-defense-blocked"]');
      const blockedWrap = q('[class~="07-layered-defense-blocked-word"]');
      const confidence = q('[class~="07-layered-defense-confidence"]');
      const targetWord = blockedWrap.dataset.target;
      const ghost = document.createElement("div");
      ghost.className = "07-layered-defense-hacker-ghost";
      ghost.textContent = targetWord;
      blockedWrap.appendChild(ghost);

      const glyphs = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789!@#$%&*";
      const pseudoGlyph = (seed) => {
        const hash = ((seed * 9301 + 49297) % 233280) / 233280;
        return glyphs[Math.floor(hash * glyphs.length)];
      };

      const blockedChars = Array.from(targetWord).map((character, index) => {
        const span = document.createElement("span");
        span.className = "07-layered-defense-hacker-char";
        span.dataset.target = character;
        span.textContent = pseudoGlyph(index * 1000);
        span.style.opacity = "0";
        span.style.transform = "rotateX(90deg)";
        blockedWrap.appendChild(span);
        return span;
      });

      tl.fromTo(
        blockedStage,
        { opacity: 0, y: "2cqh" },
        { opacity: 1, y: "0cqh", duration: 0.46, ease: "power3.out" },
        7.47
      );

      blockedChars.forEach((character, index) => {
        const flipState = { p: 0 };
        tl.to(
          flipState,
          {
            p: 1,
            duration: 0.72,
            ease: "power3.out",
            onUpdate: () => {
              const quantized = Math.floor(flipState.p * 24 / 3);
              character.textContent = flipState.p < 0.62
                ? pseudoGlyph(index * 1000 + quantized)
                : character.dataset.target;
              character.style.transform = `rotateX(${90 - flipState.p * 90}deg)`;
              character.style.opacity = `${Math.min(1, flipState.p * 2)}`;
            }
          },
          7.62 + index * 0.055
        );
      });

      tl.fromTo(
        confidence,
        { opacity: 0, y: "1.2cqh" },
        { opacity: 1, y: "0cqh", duration: 0.44, ease: "power2.out" },
        8.58
      );

      const audit = q('[class~="07-layered-defense-audit"]');
      const auditLock = q('[class~="07-layered-defense-audit-lock"]');
      const auditValues = qa('[class~="07-layered-defense-audit-value"]');

      tl.fromTo(
        audit,
        { opacity: 0, y: "2.1cqh" },
        { opacity: 1, y: "0cqh", duration: 0.48, ease: "power3.out" },
        9.56
      );
      tl.fromTo(
        auditLock,
        { scaleX: 0 },
        { scaleX: 1, duration: 0.58, ease: "power2.out" },
        9.62
      );
      auditValues.forEach((value, index) => {
        tl.fromTo(
          value,
          { opacity: 0, y: "0.9cqh" },
          { opacity: 1, y: "0cqh", duration: 0.34, ease: "power2.out" },
          9.82 + index * 0.18
        );
      });
    })();
  </script>
</template>
