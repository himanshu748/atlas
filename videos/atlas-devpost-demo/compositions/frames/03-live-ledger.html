    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
    <script>
      (() => {
        const root = document.querySelector('[data-composition-id="03-live-ledger"]');
        const select = (name) => root.getElementsByClassName(`03-live-ledger-${name}`)[0];
        const selectAll = (name) => Array.from(root.getElementsByClassName(`03-live-ledger-${name}`));

        const rail = select("rail");
        const railStub = select("rail-stub");
        const surface = select("surface");
        const coverageContext = select("coverage-context");
        const pinControls = select("pin-controls");
        const pinReadiness = select("pin-readiness");
        const proofControls = select("proof-controls");
        const proofReadiness = select("proof-readiness");
        const proofWords = selectAll("proof-word");

        const tl = gsap.timeline({ paused: true });

        tl.fromTo(
          surface,
          { x: -56, scale: 1.018, opacity: 0.72 },
          { x: 0, scale: 1, opacity: 1, duration: 0.92, ease: "power3.out" },
          0
        );
        tl.fromTo(
          rail,
          { x: -24, opacity: 0 },
          { x: 0, opacity: 1, duration: 0.54, ease: "power2.out" },
          0.08
        );
        tl.fromTo(
          railStub,
          { scaleX: 0 },
          { scaleX: 1, duration: 0.5, ease: "power2.out" },
          0.2
        );

        tl.to(
          coverageContext,
          { "--dof": "5px", opacity: 0.48, duration: 0.76, ease: "power2.inOut" },
          2.209
        );
        tl.fromTo(
          pinControls,
          { scaleX: 0, opacity: 0 },
          { scaleX: 1, opacity: 1, duration: 0.42, ease: "power2.out" },
          2.36
        );
        tl.fromTo(
          proofControls,
          { x: -18, y: -108, scale: 0.28, opacity: 0 },
          { x: 0, y: 0, scale: 1, opacity: 1, duration: 0.78, ease: "power3.out" },
          2.53
        );

        tl.to(
          proofControls,
          { x: -28, y: 12, scale: 0.82, opacity: 0.42, duration: 0.48, ease: "power2.inOut" },
          3.82
        );
        tl.fromTo(
          pinReadiness,
          { scaleX: 0, opacity: 0 },
          { scaleX: 1, opacity: 1, duration: 0.42, ease: "power2.out" },
          3.92
        );
        tl.fromTo(
          proofReadiness,
          { x: -690, y: -224, scale: 0.35, opacity: 0 },
          { x: 0, y: 0, scale: 1, opacity: 1, duration: 0.82, ease: "power3.out" },
          4.05
        );

        const ASR_DURATION = 5.601 - 2.209;
        const ATTACK_DUR = 0.16;
        const RELEASE = 0.42;
        const REST_LEVEL = 0.12;
        const MAX_BLUR = 38;
        const MAX_SCALE_BOOST = 0.16;
        const timings = {
          controls: { start: 0.38, end: 1.22 },
          readiness: { start: 2.02, end: 2.9 }
        };
        const restRgb = { r: 114, g: 124, b: 121 };
        const activeRgb = { r: 99, g: 230, b: 166 };
        const driver = { t: 0 };

        const envelope = (time, start, end) => {
          if (time < start) return 0;
          if (time < end) return Math.min((time - start) / ATTACK_DUR, 1);
          const releaseEnd = end + RELEASE;
          if (time < releaseEnd) {
            return 1 - ((time - end) / RELEASE) * (1 - REST_LEVEL);
          }
          return REST_LEVEL;
        };

        const lerpChannel = (a, b, amount) => Math.round(a + (b - a) * amount);
        tl.to(
          driver,
          {
            t: ASR_DURATION,
            duration: ASR_DURATION,
            ease: "none",
            onUpdate: () => {
              proofWords.forEach((element) => {
                const timing = timings[element.dataset.word];
                if (!timing) return;
                const env = envelope(driver.t, timing.start, timing.end);
                const r = lerpChannel(restRgb.r, activeRgb.r, env);
                const g = lerpChannel(restRgb.g, activeRgb.g, env);
                const b = lerpChannel(restRgb.b, activeRgb.b, env);
                element.style.color = `rgb(${r}, ${g}, ${b})`;
                element.style.textShadow = `0 0 ${MAX_BLUR * env}px rgba(99, 230, 166, ${0.76 * env})`;
                element.style.transform = `scale(${1 + MAX_SCALE_BOOST * env})`;
              });
            }
          },
          2.209
        );

        tl.to(
          coverageContext,
          { "--dof": "0px", opacity: 1, duration: 0.52, ease: "power2.inOut" },
          5.601
        );
        tl.to(
          proofControls,
          { x: -20, y: -112, scale: 0.34, opacity: 0.86, duration: 0.52, ease: "power2.inOut" },
          5.601
        );
        tl.to(
          proofReadiness,
          { x: -690, y: -224, scale: 0.35, opacity: 0.86, duration: 0.52, ease: "power2.inOut" },
          5.601
        );

        const inspectionHold = { t: 0 };
        tl.to(inspectionHold, { t: 1, duration: 2.479, ease: "none" }, 6.121);

        window.__timelines = window.__timelines || {};
        window.__timelines["03-live-ledger"] = tl;
      })();
    </script>
