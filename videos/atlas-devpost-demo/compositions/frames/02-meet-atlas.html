  <script>
    (() => {
      const root = document.querySelector('[data-composition-id="02-meet-atlas"]');
      const background = root.querySelector('[class~="02-meet-atlas-bg"]');
      const veil = root.querySelector('[class~="02-meet-atlas-veil"]');
      const kicker = document.getElementById("02-meet-atlas-kicker");
      const markCore = document.getElementById("02-meet-atlas-mark-core");
      const wordmark = document.getElementById("02-meet-atlas-wordmark");
      const roleCount = document.getElementById("02-meet-atlas-role-count");
      const proofRail = document.getElementById("02-meet-atlas-proof-rail");
      const markPaths = Array.from(root.querySelectorAll('[class~="02-meet-atlas-mark"] path'));
      const networkPaths = Array.from(root.querySelectorAll('[class~="02-meet-atlas-network"] path'));
      const nodes = Array.from(root.querySelectorAll('[class~="02-meet-atlas-node"]'));
      const proofs = Array.from(root.querySelectorAll('[class~="02-meet-atlas-proof"]'));

      [...markPaths, ...networkPaths].forEach((path) => {
        const length = path.getTotalLength();
        path.style.strokeDasharray = `${length}`;
        path.style.strokeDashoffset = `${length}`;
      });

      const tl = gsap.timeline({ paused: true });
      window.__timelines = window.__timelines || {};
      window.__timelines["02-meet-atlas"] = tl;

      tl.fromTo(
        background,
        { opacity: 0, scale: 1.025 },
        { opacity: 1, scale: 1, duration: 0.82, ease: "power2.out" },
        0,
      );
      tl.fromTo(
        veil,
        { opacity: 0.92 },
        { opacity: 0.42, duration: 0.9, ease: "power1.out" },
        0,
      );
      tl.fromTo(
        markCore,
        { scale: 0.35, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.32, ease: "back.out(2)" },
        0.14,
      );

      const markStarts = [0.18, 0.62, 1.03];
      const markDurations = [0.72, 0.58, 0.62];
      markPaths.forEach((path, index) => {
        tl.to(
          path,
          {
            strokeDashoffset: 0,
            duration: markDurations[index],
            ease: "power2.out",
          },
          markStarts[index],
        );
      });

      tl.fromTo(
        kicker,
        { x: -28, opacity: 0 },
        { x: 0, opacity: 1, duration: 0.56, ease: "power2.out" },
        1.58,
      );

      networkPaths.forEach((path, index) => {
        tl.to(
          path,
          {
            strokeDashoffset: 0,
            duration: 0.78,
            ease: "power2.out",
          },
          2.08 + index * 0.12,
        );
      });

      nodes.forEach((node, index) => {
        const targetX = Number(node.dataset.targetX);
        const targetY = Number(node.dataset.targetY);
        tl.fromTo(
          node,
          {
            xPercent: -50,
            yPercent: -50,
            x: targetX * 0.16,
            y: targetY * 0.16,
            scale: 0.66,
            opacity: 0,
          },
          {
            xPercent: -50,
            yPercent: -50,
            x: targetX,
            y: targetY,
            scale: 1,
            opacity: 1,
            duration: 1.72,
            ease: "power3.out",
          },
          2.62 + index * 0.08,
        );
      });

      tl.fromTo(
        roleCount,
        { y: 18, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.58, ease: "power2.out" },
        5.02,
      );

      tl.to(
        nodes,
        { opacity: 0.43, scale: 0.96, duration: 0.72, ease: "power2.out" },
        5.68,
      );
      tl.to(
        networkPaths,
        { opacity: 0.18, duration: 0.72, ease: "power1.out" },
        5.68,
      );
      tl.fromTo(
        wordmark,
        { x: -58, opacity: 0 },
        { x: 0, opacity: 1, duration: 0.68, ease: "power3.out" },
        5.7,
      );
      tl.fromTo(
        proofRail,
        { scaleX: 0.08, opacity: 0, transformOrigin: "50% 0%" },
        { scaleX: 1, opacity: 1, duration: 0.5, ease: "power2.out" },
        5.92,
      );

      const PHRASE_WINDOW_START = 6.14;
      const PHRASE_WINDOW_DURATION = 1.38;
      const phraseWeights = proofs.map((proof) => proof.dataset.copy.length);
      const phraseWeightTotal = phraseWeights.reduce((sum, value) => sum + value, 0);
      let phraseCursor = 0;
      const phraseStarts = phraseWeights.map((weight) => {
        const start = PHRASE_WINDOW_START + (phraseCursor / phraseWeightTotal) * PHRASE_WINDOW_DURATION;
        phraseCursor += weight;
        return start;
      });

      proofs.forEach((proof, index) => {
        tl.fromTo(
          proof,
          { y: 20, opacity: 0 },
          { y: 0, opacity: 1, duration: 0.46, ease: "power2.out" },
          phraseStarts[index],
        );
      });

      tl.to(
        markCore,
        { scale: 1.18, duration: 0.24, ease: "power2.out" },
        7.44,
      );
      tl.to(
        markCore,
        { scale: 1, duration: 0.28, ease: "power2.out" },
        7.68,
      );
      tl.to({}, { duration: 0.44 }, 7.96);
    })();
  </script>
